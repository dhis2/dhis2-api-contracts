name: Debug DHIS2_BOT_GITHUB_TOKEN

# Temporary diagnostic. DELETE THIS FILE before merging to main.
#
# Runs on every push to any PR from a branch in this repo, with no paths filter,
# so it fires whatever the change touches. Draft PRs trigger it too - draft state
# does not suppress the `opened`/`synchronize` events.
on:
  pull_request:
  workflow_dispatch:

jobs:
  check-token:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect token shape (no value is printed)
        env:
          TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret is empty or not visible to this repo."
            exit 1
          fi

          TRIMMED=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          echo "length=${#TOKEN}  length_without_whitespace=${#TRIMMED}"
          if [ "${#TOKEN}" -ne "${#TRIMMED}" ]; then
            echo "::error::Secret contains whitespace/newlines - it was pasted with a trailing newline or spaces."
          fi

          case "$TOKEN" in
            ghp_*)        echo "type=classic PAT" ;;
            github_pat_*) echo "type=fine-grained PAT" ;;
            ghs_*)        echo "type=GitHub App installation token" ;;
            gho_*)        echo "type=OAuth token" ;;
            *)            echo "::warning::type=unrecognised prefix - value may be truncated or malformed" ;;
          esac

      - name: Authenticate and report identity, expiry and scopes
        env:
          TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
        run: |
          CODE=$(curl -sS -o /tmp/body.json -D /tmp/headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user)

          echo "GET /user -> HTTP $CODE"
          if [ "$CODE" = "401" ]; then
            echo "::error::401 Bad credentials - the token value itself is invalid, expired or revoked."
          fi

          echo "authenticated_as=$(jq -r '.login // "n/a"' /tmp/body.json)"
          grep -i '^github-authentication-token-expiration:' /tmp/headers.txt || echo "expiration header: none (classic PAT with no expiry, or unauthenticated)"
          grep -i '^x-oauth-scopes:'                        /tmp/headers.txt || echo "x-oauth-scopes: none (fine-grained PAT, or unauthenticated)"

      - name: Check access to dhis2/dhis2-core
        env:
          TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
        run: |
          CODE=$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/dhis2/dhis2-core)

          echo "GET /repos/dhis2/dhis2-core -> HTTP $CODE"
          case "$CODE" in
            200) echo "push_permission=$(jq -r '.permissions.push' /tmp/repo.json)"
                 jq -r '.permissions.push' /tmp/repo.json | grep -q true \
                   || echo "::error::Token can read dhis2-core but cannot push - it needs write access." ;;
            401) echo "::error::401 - token invalid (same failure as the sync workflow)." ;;
            403) echo "::error::403 - token is valid but blocked (fine-grained PAT awaiting org approval, or SSO not authorised)." ;;
            404) echo "::error::404 - token is valid but has no access to dhis2-core." ;;
          esac

      - name: Check the token can actually clone dhis2-core
        env:
          TOKEN: ${{ secrets.DHIS2_BOT_GITHUB_TOKEN }}
        run: |
          if git ls-remote "https://x-access-token:$TOKEN@github.com/dhis2/dhis2-core" HEAD >/dev/null 2>&1; then
            echo "git ls-remote succeeded"
          else
            echo "::error::git ls-remote failed - the token cannot authenticate over HTTPS."
          fi
